cardTag: Individual · En producción
summary: Revisa contratos de alquiler españoles según la ley.
description: >-
  El inquilino sube su contrato de alquiler en PDF y un LLM revisa cada cláusula según la normativa española
  de vivienda, señala las nulas o desfavorables y calcula cuánto dinero podría reclamar. El análisis es
  gratis; el informe completo, con todas las cláusulas explicadas, el desglose del importe reclamable y
  mensajes de reclamación listos para enviar, es un pago único. Lo diseñé, desarrollé y lancé yo solo.
