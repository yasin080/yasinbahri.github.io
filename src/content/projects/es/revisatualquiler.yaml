howItWorks:
  - >-
    El PDF llega al modelo a través de OpenRouter (plugin `file-parser`) junto con los textos legales
    consolidados del BOE: la LAU, la Ley 12/2023 y los artículos aplicables del Código Civil. La respuesta es
    un JSON en el que cada cláusula se etiqueta como nula, desfavorable o correcta, con el artículo en que se
    basa.
  - >-
    El análisis tarda unos dos minutos. Mientras tanto, el inquilino responde hasta cinco preguntas opcionales
    (código postal, honorarios de inmobiliaria, comunidad e IBI, reparaciones pagadas y email) que alimentan
    el cálculo del importe reclamable.
  - >-
    El resultado gratis muestra cuántos problemas hay, sus títulos y el primero explicado. El informe completo
    se paga con Stripe Checkout: un webhook con firma verificada marca el análisis como pagado, genera el PDF
    con `@react-pdf/renderer` y lo envía por email con Resend.
  - >-
    SPA en React construida como una máquina de estados de vistas (landing, subida, espera, resultado,
    informe) y una API serverless en Vercel con TypeScript.
  - >-
    Supabase (PostgreSQL) guarda los análisis con seguridad a nivel de fila activada y sin políticas públicas:
    solo el servidor, con su clave secreta, puede leerlos.
  - >-
    Límites de uso en Postgres por IP, por destinatario de email y un tope global diario. Un middleware edge
    en Vercel restringe el servicio a España sin bloquear a los rastreadores de los buscadores.
decisions:
  - >-
    El modelo se eligió con un benchmark: pasé los mismos contratos por cinco modelos vía OpenRouter. El
    ganador sacó un 9,5 con un coste de unos 0,04–0,08 € por análisis.
  - >-
    Los textos legales completos (unos 20.000 tokens) van en cada prompt, así que cada hallazgo cita el
    artículo exacto, siempre como “art. X LAU”.
  - >-
    Prompt injection: el contenido del contrato se trata como datos, nunca como instrucciones. Lo probé con un
    PDF trampa.
  - >-
    Si falla, bloquea: si no se pueden comprobar los límites de uso, la petición se rechaza, para que un error
    de la base de datos no se convierta en una factura de IA sin límite.
