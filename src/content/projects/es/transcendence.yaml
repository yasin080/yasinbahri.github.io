summary: Un juego de la serpiente 3D multijugador en tiempo real, con bombas, bots y espectadores.
description: >-
  SlitherBomb es un juego online de gusanos para hasta cuatro jugadores, renderizado en 3D en el navegador,
  dentro de una aplicación web completa con cuentas, amigos, lobby en directo y espectadores. Cada partida se
  define por sus reglas: un tablero abierto se juega como el Snake clásico; con pilares, muros aleatorios y
  bombas se convierte en una arena al estilo Bomberman.
