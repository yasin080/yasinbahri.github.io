# revisatualquiler.es (EN). Inline code goes between backticks.
title: revisatualquiler.es
order: 1
featured: true
tag: Solo project · In production
tagNote: available in Spain only
cardTag: Solo · In production
summary: Checks Spanish rental contracts against the law.
description: >-
  Tenants upload their rental contract as a PDF and an LLM reviews every clause against Spanish housing law,
  flags the ones that are void or unfavourable and works out how much money they could claim back. The
  analysis is free; the full report, with every clause explained, the claimable amount broken down and claim
  messages ready to send, is a one-off payment. I designed, built and launched it on my own.
cardTech: React · TypeScript · Supabase · Stripe
stack:
  - React 19
  - TypeScript
  - Vite
  - Tailwind CSS
  - Vercel serverless functions (Node.js, TypeScript)
  - Supabase (PostgreSQL, RLS)
  - OpenRouter
  - Stripe Checkout + webhooks
  - Resend
  - '@react-pdf/renderer'
  - Vercel Analytics
