howItWorks:
  - >-
    The PDF goes to the model through OpenRouter (`file-parser` plugin) together with the consolidated legal
    texts from the BOE: the LAU, Ley 12/2023 and the relevant articles of the Civil Code. The answer is JSON,
    with each clause labelled void, unfavourable or correct and the article it relies on.
  - >-
    The analysis takes about two minutes. Meanwhile the tenant answers up to five optional questions
    (postcode, agency fees, community fees and property tax, repairs paid, email), which feed the calculation
    of the claimable amount.
  - >-
    The free result shows how many problems were found, their titles and the first one explained. The full
    report is paid with Stripe Checkout: a signed webhook marks the analysis as paid, builds the PDF with
    `@react-pdf/renderer` and emails it with Resend.
  - >-
    React SPA built as a state machine of views (landing, upload, wait, result, report) and a serverless API
    on Vercel in TypeScript.
  - >-
    Supabase (PostgreSQL) stores the analyses with row-level security on and no public policies: only the
    server, with its secret key, can read them.
  - >-
    Usage limits in Postgres per IP, per email recipient and a global daily cap. An edge middleware restricts
    the service to Spain while letting search engine crawlers through.
decisions:
  - >-
    Model chosen by benchmark: I ran the same contracts through five models via OpenRouter. The winner scored
    9.5 at about €0.04–0.08 per analysis.
  - >-
    The full legal texts (around 20,000 tokens) go into every prompt, so each finding cites the exact article,
    always written as “art. X LAU”.
  - >-
    Prompt injection: the contract is treated as data, never as instructions. I tested it with a booby-trapped
    PDF.
  - >-
    Fail closed: if the usage limits cannot be checked, the request is blocked, so a database error cannot
    turn into an unlimited AI bill.
