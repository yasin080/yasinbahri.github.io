featured: true
tag: Team of 4 · Final project of the 42 Common Core
cardTag: Team of 4
summary: A real-time multiplayer 3D snake game with bombs, bots and spectators.
description: >-
  SlitherBomb is an online worm game for up to four players, rendered in 3D in the browser, inside a full web
  app with accounts, friends, a live lobby and spectators. Every match is defined by its rules: an open board
  plays like classic Snake; add pillars, random walls and bombs and it turns into a Bomberman-style arena.
