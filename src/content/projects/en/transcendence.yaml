howItWorks:
  - >-
    The server runs every match: a long-running Laravel command (`game:tick`) applies the players’ inputs and
    the bots’ moves and broadcasts the new state over WebSockets (Laravel Reverb). Clients only send their
    moves.
  - >-
    Live match state is kept in Redis; only durable data (rooms, seats, when each match started and ended) is
    stored in MariaDB.
  - >-
    Babylon.js renders the board with three cameras, real-time shadows and post-processing. Worms glide
    between ticks by interpolating their positions every frame; touch controls on mobile.
  - >-
    Four presets (Classic, Arena, Maze, Hardcore) or custom rules: board size, speed, food, bombs that blast a
    3×3 area, pillars, random walls, and whether hitting a wall kills or blocks.
  - >-
    Bots play on the server like any other player: they look one cell ahead and head for food or bombs, with a
    mistake rate set by the host.
  - >-
    Disconnections: after 2.5 s without a ping a worm goes “away”, and the player has 10 s to come back.
    Players who give up their seat can keep watching the match.
  - >-
    Email/password (Sanctum) and Google sign-in (Socialite), profiles, avatars and friends with live online
    status.
  - >-
    One command starts the whole Docker Compose stack behind nginx (HTTPS), with a live /health page and a
    database dump every 6 hours that can be restored.
decisions:
  - >-
    Server-authoritative game loop: it keeps every player in sync, prevents cheating from the browser and lets
    bots play exactly like humans.
  - >-
    Redis for live matches: a match changes state several times per second, so writing every tick to the
    database was not an option.
  - >-
    Shared types: the TypeScript client mirrors the game state sent by the server, so mismatches are caught at
    compile time.
  - >-
    Teamwork: every change went through its own branch and a reviewed pull request, with weekly remote
    meetings to set the next goals.
